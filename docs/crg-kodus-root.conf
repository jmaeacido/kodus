server {
    listen 80;
    listen [::]:80;
    server_name 172.31.240.55;

    autoindex off;
    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Error pages point directly at real .php files so the PHP regex handler
    # resolves them on the first pass and we avoid @kodus_extensionless.
    error_page 400 /400.php;
    error_page 401 /401.php;
    error_page 403 /403.php;
    error_page 404 /404.php;
    error_page 405 /405.php;
    error_page 408 /408.php;
    error_page 429 /429.php;
    error_page 500 /500.php;
    error_page 502 /502.php;
    error_page 503 /503.php;
    error_page 504 /504.php;

    # Serve the app index for /.
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/apps/crg-kodus/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_param PATH_TRANSLATED "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        limit_req zone=kodus_php burst=20 nodelay;
    }

    # Keep explicit index.php out of browser-visible URLs.
    location = /index.php {
        return 301 /;
    }

    location ~ ^/\.(?!well-known) {
        deny all;
    }

    location ~* ^/(?:composer\.(json|lock|phar)|composer-setup\.php|phpinfo\.php|info\.php|kodus_db\.sql|kodus-key_pair\.(pem|ppk)|debug_log\.txt|__diag_password_policy\.php|__https_debug\.php)$ {
        deny all;
    }

    location ~* ^/.+\.(?:sql(?:\..*)?|bak|old|orig|save|log|ini|env|pem|ppk|key)$ {
        deny all;
    }

    location ~* ^/(?:storage|artifacts|scratch|sql|screenshots|docs|\.git|\.tmp\.driveupload|deduplication/logs)/ {
        deny all;
    }

    # Upload blocklist tier A: general upload dirs (inbox/uploads intentionally
    # omitted here so the stricter tier B below handles it).
    location ~* ^/(?:uploads|dist/img)/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|exe|sh|bat|cmd)$ {
        deny all;
    }

    # Upload blocklist tier B: sensitive upload dirs, stricter extension list.
    location ~* ^/(?:crossmatch/uploads|deduplication/uploads|inbox/uploads|pages/uploads)/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|exe|sh|bat|cmd|js|jsp|asp|aspx)$ {
        deny all;
    }

    # Run browser-visible PHP entry points from the real app directory.
    # try_files blocks PATH_INFO-style attacks (e.g. /foo.jpg/bar.php) by
    # refusing to hand off to PHP unless the script file actually exists.
    location ~* ^(?<script_path>/.*\.php)$ {
        root /opt/apps/crg-kodus;
        try_files $script_path =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$script_path;
        fastcgi_param SCRIPT_NAME $script_path;
        fastcgi_param PATH_INFO "";
        fastcgi_param PATH_TRANSLATED "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        limit_req zone=kodus_php burst=20 nodelay;
    }

    # Serve static files and directories from the app root.
    location / {
        root /opt/apps/crg-kodus;
        try_files $uri $uri/ @kodus_extensionless;
    }

    # Resolve extensionless routes to real .php or .html files.
    location @kodus_extensionless {
        if (-f /opt/apps/crg-kodus$uri.php) {
            rewrite ^ $uri.php last;
        }

        if (-f /opt/apps/crg-kodus$uri.html) {
            rewrite ^ $uri.html last;
        }

        return 404;
    }
}

# NOTE: this server block depends on a rate-limit zone declared in the main
# http {} context. Add the following to /etc/nginx/nginx.conf (inside http {})
# or to /etc/nginx/conf.d/rate-limit.conf:
#
#     limit_req_zone $binary_remote_addr zone=kodus_php:10m rate=10r/s;
#
# Without it, `nginx -t` will fail with "unknown limit_req_zone".
